name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Publish a preview of the package for every push and pull request.
      # Requires the pkg.pr.new GitHub App: https://github.com/apps/pkg-pr-new
      - name: Publish preview to pkg.pr.new
        run: pnpm dlx pkg-pr-new publish --compact --pnpm
